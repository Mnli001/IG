<title>Only One MNLI Ad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,800;0,900;1,900&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: 9:16 reel. Night sky → sunset, sakura petals, floating grass blocks, pixel-block wipes between scenes. Single look by design. */
:root{--night:#0a0a0a;--deep:#1a1a1a;--cream:#f5f5f5;--sakura:#e10600;--amber:#ff3b30;--moon:#9a9a9a;--mute:#8c8c8c;
--display:"Montserrat","Arial Black",sans-serif;--body:"Nunito",system-ui,sans-serif;--pixel:"Press Start 2P",monospace;color-scheme:dark}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);display:grid;place-items:center;box-sizing:border-box;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{position:relative;height:min(92vh,960px);aspect-ratio:9/16;max-width:100%;overflow:hidden;border-radius:18px;background:var(--night);container-type:inline-size;box-shadow:0 30px 80px -20px #e1060044;perspective:220cqw}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#fx{z-index:3}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;visibility:hidden;padding:0 6cqw;z-index:2}
.d{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:1;letter-spacing:-.01em}
.w{display:block;white-space:nowrap;padding-block:.6cqw}
.ch{display:inline-block;will-change:transform}
.small{font-family:var(--display);font-weight:800;font-size:5cqw;letter-spacing:.28em;color:var(--moon)}
.sun{color:var(--sakura)}
.glow{text-shadow:0 0 6cqw #e1060066}
.px{font-family:var(--pixel);font-weight:400;line-height:1.1}
/* stickers */
.stk{position:absolute;font:900 3.6cqw var(--body);padding:1.6cqw 3.4cqw;border-radius:99px;background:var(--cream);color:var(--night);box-shadow:0 1.2cqw 0 #0005;white-space:nowrap;z-index:4}
.stk.pk{background:var(--sakura);color:var(--cream)}.stk.am{background:var(--cream)}.stk.mn{background:#3a3a3a;color:var(--cream)}
/* portrait */
.pfpwrap{position:relative;width:66cqw;aspect-ratio:1}
.pfpwrap .rim{position:absolute;inset:-1.6cqw;border-radius:50%;background:conic-gradient(var(--amber),var(--sakura),var(--moon),var(--amber))}
.pfpwrap .halo{position:absolute;inset:-5cqw;border-radius:50%;background:radial-gradient(circle,#e1060066,transparent 70%)}
.pfpwrap img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;border:1.4cqw solid var(--night);box-sizing:border-box}
.name{margin-top:8cqw;font:italic 900 11cqw var(--display);letter-spacing:-.02em}
/* reel wall */
#r{padding:0}
.wall{position:absolute;inset:-30% -25%;display:flex;gap:3cqw;justify-content:center;transform:rotate(-10deg)}
.col{display:flex;flex-direction:column;gap:3cqw;width:30cqw;flex:none}
.col img{width:100%;aspect-ratio:9/14;object-fit:cover;border-radius:3cqw;display:block;border:.5cqw solid #fff3}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,#0a0a0af2 28%,#0a0a0a66 70%,transparent)}
.count{position:relative;font-size:24cqw;font-variant-numeric:tabular-nums}
.countlbl{position:relative;font:900 8cqw var(--display);letter-spacing:.1em;margin-top:4cqw}
/* top three */
.fan{position:relative;width:90cqw;height:74cqw;margin-top:8cqw}
.fc{position:absolute;left:50%;top:0;width:38cqw;margin-left:-19cqw;border-radius:3.4cqw;overflow:visible}
.fc img{display:block;width:100%;aspect-ratio:9/14;object-fit:cover;border-radius:3.4cqw;border:.6cqw solid var(--cream);box-shadow:0 3cqw 8cqw #0009}
.fc b{position:absolute;left:50%;bottom:-3cqw;transform:translateX(-50%);font:900 4.2cqw var(--body);background:var(--night);border:.5cqw solid var(--cream);padding:1cqw 3cqw;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
.fc .md{position:absolute;top:-5cqw;left:50%;transform:translateX(-50%);font-size:10cqw}
.top3{font-size:17cqw}
/* profile card */
.card{position:relative;width:88cqw;border-radius:6cqw;background:#ffffff12;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #ffffff30;padding:5.5cqw 5cqw;display:flex;flex-direction:column;gap:4cqw;text-align:left}
.top{display:flex;align-items:center;gap:4cqw}
.ring{width:21cqw;height:21cqw;border-radius:50%;padding:.9cqw;background:conic-gradient(var(--amber),var(--sakura),var(--moon),var(--amber));flex:none}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:.8cqw solid var(--night);display:block;box-sizing:border-box}
.handle{font-weight:900;font-size:4.2cqw;word-break:break-all}
.nm{font-size:3.4cqw;color:var(--mute);font-weight:600}
.stats{display:flex;gap:3.6cqw;font-size:2.9cqw;color:var(--mute);margin-top:1.6cqw;font-weight:600}
.stats strong{color:var(--cream);display:block;font-size:4.6cqw;font-weight:900;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:5cqw;font-size:3.1cqw;font-weight:800;color:var(--mute);border-bottom:1px solid #ffffff22;padding-bottom:2cqw}
.tabs .on{color:var(--cream);position:relative}
.tabs .on::after{content:"";position:absolute;left:0;right:0;bottom:-2.2cqw;height:.5cqw;background:var(--cream)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2cqw}
.grid span{aspect-ratio:9/14;border-radius:1.6cqw;position:relative;overflow:hidden}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid em{position:absolute;left:1.2cqw;bottom:1cqw;font-style:normal;font-size:2.5cqw;font-weight:900;text-shadow:0 0 1cqw #000}
.btn{position:relative;border-radius:3cqw;padding:3.2cqw;font-weight:900;font-size:4.2cqw;text-align:center;background:var(--sakura);color:var(--cream);overflow:hidden}
.btn .f2{position:absolute;inset:0;display:grid;place-items:center;background:#333;color:var(--cream);opacity:0}
.btn .rip{position:absolute;width:10cqw;height:10cqw;border-radius:50%;background:#fff8;left:50%;top:50%;margin:-5cqw;transform:scale(0)}
.cursor{position:absolute;left:46%;bottom:-2cqw;width:11cqw;z-index:6;opacity:0;filter:drop-shadow(0 1cqw 1.5cqw #0008);transform-origin:20% 10%}
.heart{position:absolute;left:47%;bottom:6cqw;font-size:7cqw;opacity:0;pointer-events:none;z-index:6}
/* end */
.typed{font:900 5.4cqw var(--body);white-space:nowrap;background:var(--cream);color:var(--night);padding:2cqw 4cqw;border-radius:99px;margin-top:7cqw}
.caret{display:inline-block;width:.7cqw;height:5cqw;background:var(--night);vertical-align:middle;margin-left:.6cqw}
.sub{font-size:3.8cqw;font-weight:800;color:var(--mute);margin-top:4cqw}
.endpfp{width:26cqw;height:26cqw;border-radius:50%;padding:1cqw;background:conic-gradient(var(--amber),var(--sakura),var(--moon),var(--amber));margin-bottom:6cqw}
.endpfp img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:1cqw solid var(--night);box-sizing:border-box;display:block}
/* overlays */
.lb{position:absolute;left:0;right:0;height:14cqw;background:#000;z-index:5}
.lb.t{top:0}.lb.b{bottom:0}
#wipe{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
#wipe i{position:absolute;left:-60%;width:220%;height:40%;transform:rotate(-24deg) translateX(-110%)}
.flash{position:absolute;inset:0;background:var(--cream);opacity:0;z-index:8;pointer-events:none}
.leak{position:absolute;width:120cqw;height:120cqw;border-radius:50%;background:radial-gradient(circle,#ff3b3055,transparent 60%);z-index:4;pointer-events:none;mix-blend-mode:screen;left:-60cqw;top:-40cqw}
.hud{position:absolute;inset:auto 5cqw 4cqw;display:flex;justify-content:space-between;font:800 2.5cqw var(--body);letter-spacing:.2em;color:var(--mute);font-variant-numeric:tabular-nums;z-index:6}
.prog{position:absolute;top:3cqw;left:5cqw;right:5cqw;height:.6cqw;border-radius:1cqw;background:#ffffff22;overflow:hidden;z-index:6}
.prog i{display:block;height:100%;width:0;background:var(--cream)}
.replay{position:absolute;left:50%;bottom:10cqw;transform:translateX(-50%);font:900 3.6cqw var(--body);color:var(--night);background:var(--cream);border:0;border-radius:99px;padding:2.6cqw 6cqw;cursor:pointer;visibility:hidden;white-space:nowrap;z-index:9}
.replay:focus-visible{outline:2px solid var(--sakura);outline-offset:3px}
</style>
